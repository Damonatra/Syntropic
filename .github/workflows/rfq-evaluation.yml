name: RFQ evaluation harness

on:
  push:
    paths:
      - "syntropic/evaluation.py"
      - "tests/test_evaluation.py"
      - "requirements*.txt"
      - ".github/workflows/rfq-evaluation.yml"
  pull_request:
    paths:
      - "syntropic/evaluation.py"
      - "tests/test_evaluation.py"
      - "requirements*.txt"
      - ".github/workflows/rfq-evaluation.yml"
  workflow_dispatch:

jobs:
  evaluation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_evaluation.py
